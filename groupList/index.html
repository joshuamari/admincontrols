<!DOCTYPE html>
<html>
  <head>
    <title>Admin Controls</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta charset="UTF-8" />

    <link rel="stylesheet" href="css/boxicons.css" />
    <!--COMMON-->
    <script src="js/jquery.js"></script>
    <!--COMMON-->

    <!--#region BUSTER CALL  -->
    <script>
      var busterCall = ["js/main.js", "css/index.css"];
      $.post(
        "ajax/get_version.php",
        {
          busterCall: busterCall,
          titleName: "Admin Controls",
        },
        function (data) {
          $("head").html(data);
        }
      );
    </script>

    <!--#endregion -->
  </head>

  <body>
    <!-- #region Modal -->
    <div
      class="modal fade"
      id="addGroupModal"
      data-bs-backdrop="static"
      data-bs-keyboard="false"
      tabindex="-1"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-[var(--dark-color)]">
          <div class="modal-header bg-[var(--dark-color)] border-0">
            <h1 class="text-md">Add New Group</h1>
            <button
              type="button"
              class="btn-close close-btn"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <div class="flex gap-3">
              <div class="mb-3 w-full">
                <label class="form-label" for="grpName">Group Name</label>
                <input
                  type="text"
                  class="px-[0.35rem] py-[0.375rem] bg-[var(--card-color)] focus:outline-none focus:ring focus:ring-orange-700 w-full relative block rounded-md border-1"
                  id="grpName"
                  placeholder="Group Name"
                />
                <small class="text-[var(--secondary-color)] hidden"
                  >Input group name</small
                >
              </div>
              <div class="mb-3">
                <label class="form-label" for="grpCode">Group Acronym</label>
                <input
                  type="text"
                  class="px-[0.35rem] py-[0.375rem] bg-[var(--card-color)] focus:outline-none focus:ring focus:ring-orange-700 w-full relative block rounded-md border-1"
                  id="grpCode"
                  placeholder="XXX"
                />
                <small class="text-[var(--secondary-color)] hidden"
                  >Input group acronym</small
                >
              </div>
            </div>
            <div class="mb-3 w-full">
              <label class="form-label" for="deptList">Department</label>
              <select
                class="select w-full rounded-md bg-[var(--card-color)] focus:outline-none focus:ring focus:ring-orange-700 h-full w-full"
                id="deptList"
              >
                <option selected hidden>Select Department</option>
                <option>Project</option>
                <option>Solution</option>
              </select>
              <small class="text-[var(--secondary-color)] hidden"
                >Select Department</small
              >
            </div>
          </div>
          <div class="modal-footer border-0">
            <button
              type="button"
              class="px-[0.75rem] py-[0.375rem] font-medium shadow-sm bg-orange-600 hover:bg-orange-800 rounded-md"
              id="addButton"
            >
              Add Group
            </button>
          </div>
        </div>
      </div>
    </div>

    <div
      class="modal fade"
      id="editGroupModal"
      data-bs-backdrop="static"
      data-bs-keyboard="false"
      tabindex="-1"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-[var(--dark-color)]">
          <div class="modal-header bg-[var(--dark-color)] border-0">
            <h1 class="text-md">Edit Group</h1>
            <button
              type="button"
              class="btn-close close-btn"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <div class="flex gap-3">
              <div class="mb-3 w-full">
                <label class="form-label" for="grpName">Group Name</label>
                <input
                  type="text"
                  class="px-[0.35rem] py-[0.375rem] bg-[var(--card-color)] focus:outline-none focus:ring focus:ring-orange-700 w-full relative block rounded-md border-1"
                  id="grpNameEdit"
                  placeholder="Group Name"
                />
                <small class="text-[var(--secondary-color)] hidden"
                  >Input group name</small
                >
              </div>
              <div class="mb-3">
                <label class="form-label" for="grpCode">Group Acronym</label>
                <input
                  type="text"
                  class="px-[0.35rem] py-[0.375rem] bg-[var(--card-color)] focus:outline-none focus:ring focus:ring-orange-700 w-full relative block rounded-md border-1"
                  id="grpCodeEdit"
                  placeholder="XXX"
                />
                <small class="text-[var(--secondary-color)] hidden"
                  >Input group acronym</small
                >
              </div>
            </div>
            <div class="mb-3 w-full">
              <label class="form-label" for="deptListEdit">Department</label>
              <select
                type="date"
                class="select w-full rounded-md bg-[var(--card-color)] focus:outline-none focus:ring focus:ring-orange-700 h-full w-full"
                id="deptListEdit"
              >
                <option selected hidden>Select Department</option>
                <option>Project</option>
                <option>Solution</option>
              </select>
              <small class="text-[var(--secondary-color)] hidden"
                >Select Department</small
              >
            </div>
          </div>
          <div class="modal-footer border-0">
            <button
              type="button"
              class="px-[0.75rem] py-[0.375rem] font-medium shadow-sm bg-orange-600 hover:bg-orange-800 rounded-md"
              id="saveButton"
            >
              Save Changes
            </button>
          </div>
        </div>
      </div>
    </div>

    <!----#endregion---->

    <div class="h-screen w-full flex">
      <div class="navigation actived">
        <ul id="acNavLinks">
          <li class="font-semibold">
            <a href="#">
              <span class="icon"><i class="bx bxs-lock-open"></i></span>
              <span class="title" style="font-size: 20px">Admin Controls</span>
            </a>
          </li>

          <li class="" style="font-weight: 500">
            <a href="../employeeList/">
              <span class="icon"><i class="bx bxs-user"></i></span>
              <span class="title">Employee List</span>
            </a>
          </li>
          <li class="startli" style="font-weight: 500">
            <a href="../groupList/">
              <span class="icon"><i class="bx bxs-group"></i></span>
              <span class="title">Group List</span>
            </a>
          </li>
        </ul>
      </div>
      <div class="main actived">
        <div class="h-[60px] w-full flex justify-between items-center">
          <div class="w-[60px] h-[60px] flex justify-center items-center">
            <i
              class="bx bx-menu text-[2.5em] text-white menu cursor-pointer"
            ></i>
          </div>
          <div class="user pe-2">
            <h5 class="text-[20px]">
              Hello, <span class="hello-user">User</span>
            </h5>
          </div>
        </div>
        <div class="w-full h-[calc(100%-60px)] flex p-6">
          <div
            class="w-full bg-[var(--dark-color)] flex-col flex gap-3 p-3 rounded-lg"
          >
            <h1 class="text-[24px]">Group List</h1>

            <div class="flex justify-between w-full gap-3">
              <div class="relative w-full">
                <input
                  id="searchWord"
                  type="search"
                  class="ps-[30px] pe-2 bg-[var(--card-color)] focus:outline-none focus:ring focus:ring-orange-700 h-full w-full relative block rounded-md"
                  style="border: 1px solid rgb(31 41 55)"
                  placeholder="Search group name . . ."
                />
                <i
                  class="bx bx-search absolute top-[8px] left-[8px] text-[16px]"
                ></i>
              </div>
              <button
                type="button"
                id="addGroup"
                class="flex c gap-1 px-3 py-2 items-center justify-center bg-gradient-to-r from-orange-500 to-rose-600 hover:from-orange-700 hover:to-rose-700 rounded-md transition-colors duration-300 whitespace-nowrap"
                title="Add Employee"
                data-bs-toggle="modal"
                data-bs-target="#addGroupModal"
              >
                <i class="bx bx-plus"></i>
                Add Group
              </button>
            </div>

            <div class="table-cont h-[calc(100%-60px)] w-full overflow-auto">
              <table class="w-full">
                <thead class="sticky top-0">
                  <tr>
                    <th>#</th>
                    <th class="">
                      <div class="flex gap-1 items-center">
                        Group Name<i class="bx bx-sort"></i>
                      </div>
                    </th>
                    <th>Group Acronym</th>
                    <th>Department</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="groupList"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
